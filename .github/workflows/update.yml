name: Update Seasons

on:
  schedule:
    - cron: '23 */12 * * *' # Run every 12 hours
  repository_dispatch:
    types: [deploy-approved] # Triggered when approved via Telegram button
  workflow_dispatch: # Enable manual triggers

permissions:
  contents: write

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process Approved Telegram Deployment
        if: github.event_name == 'repository_dispatch' && github.event.action == 'deploy-approved'
        run: |
          echo "Processing Telegram approved deployment..."
          APPROVED_JSON='${{ github.event.client_payload.approvedJson }}'
          if [ -n "$APPROVED_JSON" ]; then
            echo "$APPROVED_JSON" > data/seasons.json
            echo "Updated data/seasons.json with approved draft payload."
          fi
          node scripts/build.js

      - name: Run Auto-Update Parser (Check for new data)
        if: github.event_name != 'repository_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_ENDPOINT: ${{ secrets.WORKER_ENDPOINT }}
        run: node scripts/update-seasons.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            echo "Content changes detected. Committing..."
            git commit -m "chore: auto-update seasons data and cache [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi


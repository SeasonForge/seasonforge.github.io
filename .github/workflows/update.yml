name: Update Seasons

on:
  schedule:
    - cron: '23 */12 * * *' # Run every 12 hours
  repository_dispatch:
    types: [deploy-approved] # Triggered when approved via Telegram button
  workflow_dispatch: # Enable manual triggers

permissions:
  contents: write

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process Approved Telegram Deployment
        if: github.event_name == 'repository_dispatch' && github.event.action == 'deploy-approved'
        env:
          APPROVED_PAYLOAD: ${{ toJson(github.event.client_payload.approvedJson) }}
        run: |
          echo "Processing Telegram approved deployment..."
          node -e "
            const fs = require('fs');
            const raw = process.env.APPROVED_PAYLOAD;
            if (raw) {
              try {
                let data = JSON.parse(raw);
                if (typeof data === 'string') data = JSON.parse(data);
                if (data && (data.games || data.changelog)) {
                  fs.writeFileSync('data/seasons.json', JSON.stringify(data, null, 2), 'utf-8');
                  console.log('Successfully updated data/seasons.json with approved draft payload.');
                }
              } catch (err) {
                console.error('Error writing approved seasons JSON:', err.message);
                process.exit(1);
              }
            }
          "
          node scripts/build.js

      - name: Run Auto-Update Parser (Check for new data)
        if: github.event_name != 'repository_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_ENDPOINT: "https://contact-form.pupkin-vasya-pupik.workers.dev/api/pending-log"
        run: node scripts/update-seasons.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            echo "Content changes detected. Committing..."
            git commit -m "chore: auto-update seasons data and cache [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

